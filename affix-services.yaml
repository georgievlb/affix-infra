apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: affix-services
  namespace: argocd
spec:
  project: affix-apps

  source:
    repoURL: 'https://github.com/georgievlb/affix-manifests.git'
    targetRevision: main
    path: .
  revisionHistoryLimit: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: affix

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
