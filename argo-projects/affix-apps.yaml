apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: affix-apps
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  destinations:
  - namespace: affix
    server: https://kubernetes.default.svc
  orphanedResources:
    warn: false
  sourceRepos:
  - 'https://github.com/georgievlb/affix-manifests.git'
